    "langchain-community>=0.3.0",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.12",
    "jinja2>=3.1.4",
    "aiofiles>=24.1.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "langchain-litellm>=0.2.1",
    "colorlog>=6.9.0",
]
