<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube视频字幕转讲义工具</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-shadow {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        .progress-bar {
            transition: width 0.3s ease;
        }
        .markdown-content {
            line-height: 1.8;
        }
        .markdown-content h1, .markdown-content h2, .markdown-content h3 {
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            font-weight: bold;
        }
        .markdown-content h1 { font-size: 1.875rem; }
        .markdown-content h2 { font-size: 1.5rem; }
        .markdown-content h3 { font-size: 1.25rem; }
        .markdown-content blockquote {
            border-left: 4px solid #3b82f6;
            padding-left: 1rem;
            margin: 1rem 0;
            background-color: #f8fafc;
            padding: 1rem;
            border-radius: 0.375rem;
        }
        .markdown-content pre {
            background-color: #1f2937;
            color: #f9fafb;
            padding: 1rem;
            border-radius: 0.375rem;
            overflow-x: auto;
        }
        .markdown-content code {
            background-color: #e5e7eb;
            padding: 0.125rem 0.25rem;
            border-radius: 0.25rem;
            font-family: 'Courier New', monospace;
        }
        .markdown-content ul, .markdown-content ol {
            margin: 1rem 0;
            padding-left: 2rem;
        }
        .markdown-content li {
            margin: 0.5rem 0;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 头部 -->
    <header class="gradient-bg text-white py-6">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-video text-3xl"></i>
                    <h1 class="text-3xl font-bold">YouTube视频字幕转讲义</h1>
                </div>
                <div class="text-sm opacity-90">
                    <i class="fas fa-robot mr-2"></i>
                    AI驱动的智能学习工具
                </div>
            </div>
        </div>
    </header>

    <!-- 主要内容 -->
    <main class="container mx-auto px-4 py-8">
        <!-- 输入表单 -->
        <div class="bg-white rounded-lg card-shadow p-6 mb-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 flex items-center">
                <i class="fas fa-play-circle text-blue-500 mr-3"></i>
                开始转换
            </h2>

            <form id="videoForm" class="space-y-6">
                <div>
                    <label for="videoId" class="block text-sm font-medium text-gray-700 mb-2">
                        YouTube视频URL或ID
                    </label>
                    <input
                        type="text"
                        id="videoId"
                        name="videoId"
                        placeholder="例如: https://www.youtube.com/watch?v=dQw4w9WgXcQ 或 dQw4w9WgXcQ"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        required
                    >
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="modelName" class="block text-sm font-medium text-gray-700 mb-2">
                            AI模型名称
                        </label>
                        <div class="flex space-x-2">
                            <input
                                type="text"
                                id="modelName"
                                name="modelName"
                                placeholder="例如: gpt-4o, claude-3-5-sonnet-20241022, gemini-1.5-pro"
                                class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                required
                            >
                            <button
                                type="button"
                                id="validateModelBtn"
                                class="px-3 py-3 bg-blue-500 hover:bg-blue-600 text-white rounded-lg text-sm flex items-center"
                                title="验证模型"
                            >
                                <i class="fas fa-check"></i>
                            </button>
                        </div>
                        <div class="mt-2 text-xs text-gray-500">
                            <span id="modelStatus">请输入LiteLLM支持的模型名称</span>
                        </div>
                        <div class="mt-2 text-xs text-blue-600">
                            <details>
                                <summary class="cursor-pointer">常用模型示例</summary>
                                <div class="mt-2 space-y-1">
                                    <div><strong>Anthropic:</strong> claude-opus-4-20250514, claude-sonnet-4-20250514</div>
                                    <div><strong>Google:</strong> gemini/gemini-2.5-pro-preview-05-06</div>
                                    <div><strong>DeepSeek:</strong> deepseek/deepseek-chat</div>
                                </div>
                            </details>
                        </div>
                    </div>

                    <div>
                        <label for="language" class="block text-sm font-medium text-gray-700 mb-2">
                            Note Language
                        </label>
                        <select
                            id="language"
                            name="language"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        >
                            <option value="简体中文">简体中文</option>
                            <option value="English">English</option>
                            <option value="custom">其他（手动输入）</option>
                        </select>
                        <input
                            type="text"
                            id="customLanguage"
                            name="customLanguage"
                            placeholder="请输入语言名称，例如：繁体中文、日本語、Français等"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent mt-2 hidden"
                        >
                    </div>
                </div>

                <button
                    type="submit"
                    id="submitBtn"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200 flex items-center justify-center"
                >
                    <i class="fas fa-magic mr-2"></i>
                    开始生成讲义
                </button>
            </form>
        </div>

        <!-- 进度显示 -->
        <div id="progressSection" class="bg-white rounded-lg card-shadow p-6 mb-8 hidden">
            <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                <i class="fas fa-cog fa-spin text-blue-500 mr-3"></i>
                处理进度
            </h3>

            <div class="mb-4">
                <div class="flex justify-between text-sm text-gray-600 mb-2">
                    <span id="progressMessage">准备中...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-3">
                    <div id="progressBar" class="bg-blue-600 h-3 rounded-full progress-bar" style="width: 0%"></div>
                </div>
            </div>

            <div class="text-sm text-gray-500">
                <i class="fas fa-info-circle mr-2"></i>
                处理时间可能需要1-3分钟，请耐心等待...
            </div>
        </div>

        <!-- 结果显示 -->
        <div id="resultSection" class="bg-white rounded-lg card-shadow p-6 hidden">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-gray-800 flex items-center">
                    <i class="fas fa-file-alt text-green-500 mr-3"></i>
                    生成的讲义
                </h3>
                <div class="flex space-x-2">
                    <button id="copyBtn" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg text-sm flex items-center">
                        <i class="fas fa-copy mr-2"></i>
                        复制
                    </button>
                    <button id="downloadBtn" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg text-sm flex items-center">
                        <i class="fas fa-download mr-2"></i>
                        下载
                    </button>
                </div>
            </div>

            <div id="lectureContent" class="markdown-content prose max-w-none bg-gray-50 p-6 rounded-lg border"></div>

            <div class="mt-4 text-sm text-gray-500 flex items-center justify-between">
                <span>
                    <i class="fas fa-robot mr-2"></i>
                    模型: <span id="usedModel">-</span>
                </span>
                <span>
                    <i class="fas fa-clock mr-2"></i>
                    生成时间: <span id="createdTime">-</span>
                </span>
            </div>
        </div>

        <!-- 错误显示 -->
        <div id="errorSection" class="bg-red-50 border border-red-200 rounded-lg p-6 hidden">
            <div class="flex items-center">
                <i class="fas fa-exclamation-triangle text-red-500 mr-3"></i>
                <div>
                    <h3 class="text-lg font-bold text-red-800">处理失败</h3>
                    <p id="errorMessage" class="text-red-600 mt-2"></p>
                </div>
            </div>
        </div>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
